<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span class="brand-mark">P</span><span>PROFILE MANAGER</span></div>
    <div class="drag"></div>
    <div class="window-controls">
      <button data-win="minimize" title="Thu nhỏ">&#8211;</button>
      <button data-win="maximize" title="Phóng to">&#9723;</button>
      <button data-win="close" class="close" title="Đóng">&#10005;</button>
    </div>
  </header>

  <main class="page">
    <section class="intro">
      <div class="eyebrow">QUẢN LÝ TÀI KHOẢN</div>
      <h1>Profile Manager</h1>
    </section>

    <nav class="tab-nav" role="tablist" aria-label="Menu chính">
      <button class="tab-button active" type="button" role="tab" aria-selected="true" data-tab-target="run">Chạy Tool</button>
      <button class="tab-button" type="button" role="tab" aria-selected="false" data-tab-target="profiles">Profiles</button>
    </nav>

    <div class="tab-panel active" role="tabpanel" data-tab-panel="run">
    <section class="manager card">
      <div class="form-grid">
        <label class="field">
          <span>Số lượng tài khoản</span>
          <input id="profile-count" type="number" min="1" max="8" step="1" value="4" />
        </label>
        <label class="field">
          <span>Website</span>
          <select id="site-select" disabled>
            <option>Đang tải danh sách…</option>
          </select>
        </label>
      </div>
      <div class="action-row">
        <button id="run-profiles" class="run-button" disabled>
          <span class="run-icon">▶</span> Chạy Tool
        </button>
        <button id="close-profiles" class="close-button" disabled>Đóng tất cả</button>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite">Chọn website để bắt đầu.</div>
    </section>

    <section class="profiles-section febet-section card">
      <div class="section-heading">
        <div><div class="eyebrow">FEBET · DREAM GAMING</div><h2>Chọn và đồng bộ bàn</h2></div>
      </div>
      <div class="febet-actions">
        <button id="scan-dg" class="close-button">Quét lại bàn</button>
      </div>
      <div class="febet-select-row">
        <label class="setting-field" for="dg-table-select"><span>Bàn</span>
          <select id="dg-table-select" disabled><option value="">Chưa quét bàn</option></select>
        </label>
        <button id="sync-dg-table" class="run-button" disabled>Đưa profiles vào bàn</button>
      </div>
    </section>
    </div>

    <div class="tab-panel" role="tabpanel" data-tab-panel="profiles">
    <section class="profiles-section settings-section">
      <div class="section-heading">
        <div><div class="eyebrow">CẤU HÌNH</div><h2>Proxy và cửa sổ</h2></div>
      </div>
      <div id="profile-settings" class="profile-settings"></div>
    </section>
    <section class="profiles-section">
      <div class="section-heading">
        <div><div class="eyebrow">QUẢN LÝ</div><h2>Profiles</h2></div>
        <span id="profile-total" class="total">0 profile</span>
      </div>
      <div id="profile-list" class="profile-list"></div>
    </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
